name: Deploy — Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency deploy only)"
        required: false
        default: "false"

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Building Docker images ==="
            docker compose build --no-cache --parallel

            echo "=== Starting services ==="
            docker compose up -d --remove-orphans

            echo "=== Running migrations ==="
            docker compose exec -T api dotnet ef database update \
              --project src/AiEncyclopedia.Infrastructure \
              --startup-project src/AiEncyclopedia.API

            echo "=== Health check ==="
            for i in $(seq 1 10); do
              if docker compose exec -T api curl -sf http://localhost:8080/health; then
                echo "API healthy."
                break
              fi
              echo "Attempt $i/10 — retrying in 5s..."
              sleep 5
            done

            echo "=== Deploy complete ==="
            docker compose ps
